name: Deploy Dyna-MO PTM Web

on:
  push:
    branches: [main]
    paths:
      - "dyna-mo-web/**"
      - "submission/master_table_all_v2.csv"
      - "submission/p1_reuse_metadata_v0_3/**"
      - "submission/starting_structure_*.v0.3.0.csv"
      - "submission/figures/**"
      - "dist/dyna-mo-ptm-v0.3.0-starting-structures.tar.gz"
      - "inputs/all_ptm_pdbs.tar.gz"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dyna-mo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore locked starting-structure archive
        working-directory: .
        run: |
          mkdir -p dist .release-cache
          curl --fail --location --retry 3 \
            "https://zenodo.org/records/22046475/files/dyna-mo-ptm-v0.3.0-lite.tar.gz?download=1" \
            --output .release-cache/dyna-mo-ptm-v0.3.0-lite.tar.gz
          tar -xzf .release-cache/dyna-mo-ptm-v0.3.0-lite.tar.gz \
            dyna-mo-ptm-v0.3.0-lite/data/dyna-mo-ptm-v0.3.0-starting-structures.tar.gz
          mv dyna-mo-ptm-v0.3.0-lite/data/dyna-mo-ptm-v0.3.0-starting-structures.tar.gz \
            dist/dyna-mo-ptm-v0.3.0-starting-structures.tar.gz
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ZENODO_DOI: 10.5281/zenodo.22059934
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dyna-mo-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
