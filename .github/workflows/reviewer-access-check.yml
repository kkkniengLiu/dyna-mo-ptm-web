name: Anonymous DynaMo data access check
on:
  push:
    branches: [codex/reviewer-access-check-20261121]
    paths: [.github/workflows/reviewer-access-check.yml]
permissions:
  contents: read
jobs:
  anonymous-public-download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check public DOI and anonymously download data
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PREP'
          import base64
          from pathlib import Path
          Path('probe.py').write_bytes(base64.b64decode(''))
          Path('expected.json').write_bytes(base64.b64decode(''))
          PREP
          python3 probe.py
